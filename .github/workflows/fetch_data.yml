name: Fetch QQQ data (for backtest updates)
on:
  workflow_dispatch:
    inputs:
      start:
        description: "first date (YYYY-MM-DD)"
        default: "2026-10-01"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python fetch_minutes.py "${{ github.event.inputs.start }}"
      - name: Save to the data-export branch
        run: |
          git config user.name "trading-bot"; git config user.email "trading-bot@users.noreply.github.com"
          git checkout --orphan data-export
          git rm -rq --cached . ; git add data_export/
          git commit -qm "QQQ data export $(date -u +%F)"
          git push -f origin data-export
