name: QLD + day-trade bot (QQQ signals)

# One process per trading day: day-trade checks on QQQ every 30 minutes from 10:00 ET (TQQQ / SQQQ),
# closes day trades at 3:55, then the QLD overnight decision at 3:58 pm ET.
# GitHub jobs are capped at 6 hours and schedules can start late, so a run is started every 30 minutes;
# the first one within an hour of 10:00 ET carries the day (up to ~5.5 h), and a queued run picks up the rest.
# Runs never overlap (concurrency below). Every action reads the account first, so a repeated check is harmless.
on:
  schedule:
    - cron: "7,37 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = compute the latest check and the QLD decision now, no orders; trade = a normal run"
        type: choice
        options: [test, trade]
        default: test

concurrency:
  group: trading-bot-qld
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the bot
        env:
          QLD_KEY: ${{ secrets.QLD_APCA_API_KEY_ID }}
          QLD_SECRET: ${{ secrets.QLD_APCA_API_SECRET_KEY }}
          MAIN_KEY: ${{ secrets.APCA_API_KEY_ID }}
          MAIN_SECRET: ${{ secrets.APCA_API_SECRET_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ -n "$QLD_KEY" ]; then
            export APCA_API_KEY_ID="$QLD_KEY" APCA_API_SECRET_KEY="$QLD_SECRET"
          elif [ "$MODE" = "test" ]; then
            echo "QLD keys not added yet - test mode reads market data with the QQQ bot's keys (places no orders)."
            export APCA_API_KEY_ID="$MAIN_KEY" APCA_API_SECRET_KEY="$MAIN_SECRET"
          else
            echo "Add the QLD_APCA_API_KEY_ID and QLD_APCA_API_SECRET_KEY secrets (keys of a second Alpaca paper account)."; exit 1
          fi
          if [ "$MODE" = "test" ]; then
            python day_trader.py --config bot_config_qld.json --test
          else
            python day_trader.py --config bot_config_qld.json --max-wait 60 --max-minutes 330
          fi

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-qld-${{ github.run_id }}
          path: logs_qld/
          retention-days: 30

      - name: Commit the logs when something happened
        if: always() && github.event.inputs.mode != 'test'
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain logs_qld/decisions.csv logs_qld/day_trades.csv)" ]; then
            git add logs_qld/decisions.csv logs_qld/day_trades.csv 2>/dev/null || git add logs_qld/
            git commit -m "QLD + day-trade bot log $(date -u +%Y-%m-%d)"
            git pull --rebase && git push
          else
            echo "Nothing traded or decided in this run - nothing to commit."
          fi
